name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        working-directory: packages/web
        run: bun run lint

      - name: Type check
        working-directory: packages/web
        run: bun run type-check

      - name: Unit tests
        working-directory: packages/web
        run: bun run test:unit

      - name: Build
        working-directory: packages/web
        run: bun run build

  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Prisma generate
        working-directory: packages/server
        run: bunx --bun prisma generate

      - name: Lint
        working-directory: packages/server
        run: bun run lint

      #   - name: Tests
      #     working-directory: packages/server
      #     run: bun run test

      - name: Build
        working-directory: packages/server
        run: bun run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        run: docker build -f packages/server/Dockerfile -t coinz-server:ci .
